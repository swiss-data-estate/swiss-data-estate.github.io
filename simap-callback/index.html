<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login callback</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}
code{display:block;word-break:break-all;background:#f3f3f3;padding:.75rem;border-radius:6px}</style>
</head><body>
<h1>Login complete</h1>
<p>Copy this code into the command-line tool (valid for a short time):</p>
<code id="code">(no code in the address)</code>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("code")) document.getElementById("code").textContent = p.get("code");
  if (p.get("error")) document.getElementById("code").textContent = "Error: " + p.get("error");
</script>
</body></html>
